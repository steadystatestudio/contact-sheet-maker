name: Test and package (no retained downloads)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and package (${{ matrix.os }})
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      PYTHONUTF8: "1"
      BUILD_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      # Official tag-to-commit pins verified against actions/* on 2026-10-06.
      - name: Check out the tested revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          architecture: x64
      - name: Install Linux runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libegl1 libopengl0 libgl1 libdbus-1-3 libfontconfig1 libfreetype6 \
            libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libxcb-xkb1
      - name: Install exact build and test dependencies
        run: |
          python -m pip install -r requirements-build-lock.txt
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Run the full test suite
        run: python -m pytest -q --junitxml=artifacts/test-results.xml
      - name: Fetch digest-pinned AppImage inputs
        if: runner.os == 'Linux'
        run: python scripts/fetch_appimagetool.py
      - name: Build native packages
        run: python scripts/build.py
      - name: Smoke test Windows executable
        if: runner.os == 'Windows'
        run: python scripts/smoke_bundle.py dist/Contact-Sheet-Maker/Contact-Sheet-Maker.exe
      - name: Smoke test Linux executable and AppImage
        if: runner.os == 'Linux'
        run: |
          python scripts/smoke_bundle.py dist/Contact-Sheet-Maker/Contact-Sheet-Maker
          APPIMAGE_EXTRACT_AND_RUN=1 python scripts/smoke_bundle.py dist/Contact-Sheet-Maker-x86_64.AppImage
      - name: Report validation
        shell: bash
        run: echo "Native tests, package build and packaged smoke checks passed. Public candidates are staged with the manual beta release workflow." >> "$GITHUB_STEP_SUMMARY"
