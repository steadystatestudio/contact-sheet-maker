name: Stage reviewed beta (draft only)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing reviewed tag, vX.Y.Z-beta.N
        required: true
        type: string
      expected_commit:
        description: Exact reviewed 40-character commit SHA
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: beta-release-${{ inputs.tag }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  PYTHONUTF8: "1"
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
  QT_QPA_PLATFORM: offscreen
  RELEASE_TAG: ${{ inputs.tag }}
  BUILD_SOURCE_COMMIT: ${{ inputs.expected_commit }}

jobs:
  prepare:
    if: github.repository == 'steadystatestudio/contact-sheet-maker' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.candidate.outputs.release_id }}
      commit: ${{ steps.candidate.outputs.commit }}
      tree: ${{ steps.candidate.outputs.tree }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Validate reviewed tag and prepare draft prerelease
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release.py init --tag "$RELEASE_TAG" --commit "$BUILD_SOURCE_COMMIT"

  build:
    needs: prepare
    timeout-minutes: 45
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: Windows
          - os: ubuntu-22.04
            platform: Linux
    runs-on: ${{ matrix.os }}
    env:
      BUILD_SOURCE_TREE: ${{ needs.prepare.outputs.tree }}
      RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
      RELEASE_PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          architecture: x64
      - name: Install Linux desktop libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libegl1 libopengl0 libgl1 libdbus-1-3 libfontconfig1 libfreetype6 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1
      - name: Install exact dependencies
        run: |
          python -m pip install -r requirements-build-lock.txt
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Test exact release source
        run: python -m pytest -q --junitxml=artifacts/test-results.xml
      - name: Fetch verified AppImage inputs
        if: runner.os == 'Linux'
        run: python scripts/fetch_appimagetool.py
      - name: Build native packages and provenance
        run: python scripts/build.py
      - name: Smoke Windows package
        if: runner.os == 'Windows'
        run: python scripts/smoke_bundle.py dist/Contact-Sheet-Maker/Contact-Sheet-Maker.exe
      - name: Smoke Linux package and AppImage
        if: runner.os == 'Linux'
        run: |
          python scripts/smoke_bundle.py dist/Contact-Sheet-Maker/Contact-Sheet-Maker
          APPIMAGE_EXTRACT_AND_RUN=1 python scripts/smoke_bundle.py dist/Contact-Sheet-Maker-x86_64.AppImage
      - name: Retain successful packages and synthetic QA in draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release.py stage --platform "$RELEASE_PLATFORM" --tag "$RELEASE_TAG" --commit "$BUILD_SOURCE_COMMIT" --tree "$BUILD_SOURCE_TREE" --release-id "$RELEASE_ID"

  sources:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      BUILD_SOURCE_TREE: ${{ needs.prepare.outputs.tree }}
      RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Fetch digest-pinned matching source archives
        run: python scripts/fetch_release_sources.py
      - name: Retain complete library sources in the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release.py stage --platform Sources --tag "$RELEASE_TAG" --commit "$BUILD_SOURCE_COMMIT" --tree "$BUILD_SOURCE_TREE" --release-id "$RELEASE_ID"

  compatibility:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      BUILD_SOURCE_TREE: ${{ needs.prepare.outputs.tree }}
      RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install independent verification and desktop libraries
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libegl1 libopengl0 libgl1 libdbus-1-3 libfontconfig1 libfreetype6 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1
          python -m pip install -r requirements-build-lock.txt
      - name: Download and verify exact retained Linux bytes and BUILD-INFO
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release.py verify-linux --tag "$RELEASE_TAG" --commit "$BUILD_SOURCE_COMMIT" --tree "$BUILD_SOURCE_TREE" --release-id "$RELEASE_ID"
      - name: Smoke the retained Ubuntu 22.04 packages on Ubuntu 24.04
        run: |
          chmod +x candidate/Contact-Sheet-Maker-x86_64.AppImage
          python scripts/smoke_bundle.py candidate/Contact-Sheet-Maker/Contact-Sheet-Maker --output-dir artifacts/smoke-ubuntu24-bundle
          APPIMAGE_EXTRACT_AND_RUN=1 python scripts/smoke_bundle.py candidate/Contact-Sheet-Maker-x86_64.AppImage --output-dir artifacts/smoke-ubuntu24-appimage
      - name: Retain compatibility evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release.py stage --platform Ubuntu24 --tag "$RELEASE_TAG" --commit "$BUILD_SOURCE_COMMIT" --tree "$BUILD_SOURCE_TREE" --release-id "$RELEASE_ID"

  receipt:
    needs: [prepare, build, sources, compatibility]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      BUILD_SOURCE_TREE: ${{ needs.prepare.outputs.tree }}
      RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Verify retained asset digests and record passed automated gates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/release.py finalize --tag "$RELEASE_TAG" --commit "$BUILD_SOURCE_COMMIT" --tree "$BUILD_SOURCE_TREE" --release-id "$RELEASE_ID"
          echo "Automated gates passed. Inspect RELEASE-READY.json and complete privacy/native review before manually publishing. This release is still a draft prerelease." >> "$GITHUB_STEP_SUMMARY"
