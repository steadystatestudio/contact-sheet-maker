[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "steady-contact-sheet"
version = "1.2.6"
description = "Free, offline contact sheets from Steady State Studio"
requires-python = ">=3.12"
license = "MIT"
authors = [{name = "Steady State Studio"}]
dependencies = ["PySide6==6.12.0", "Pillow>=11,<13", "reportlab>=4.4,<6"]

[project.urls]
Homepage = "https://steady-state-studio.com/apps/contact-sheet-maker/"
Repository = "https://github.com/steadystatestudio/contact-sheet-maker"
Issues = "https://github.com/steadystatestudio/contact-sheet-maker/issues"
Support = "https://steady-state-studio.com/support/"

[project.optional-dependencies]
test = ["pytest>=8", "pypdf>=5", "PyInstaller>=6"]
build = ["PyInstaller>=6"]

[project.gui-scripts]
steady-contact-sheet = "contact_sheet.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
contact_sheet = ["assets/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
